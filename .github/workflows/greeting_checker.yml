# .github/workflows/greeting_checker.yml
name: Greeting Check

# 1. WHEN should this run?
on: 
  pull_request: # Run every time a PR is opened or updated

# 2. WHAT should it do?
jobs:
  run-the-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Run the Greeting Tool
        # This is where the Manager calls the Tool
        run: node bin/check_greeting.js